# A bridge sequencer's configuration.
#
# One of these per federation member. Nothing here is shared between members except the network
# and the block at which bridge transactions start paying, both of which must match the chain.

sequencer {

  # The Besu node this sequencer reads the bridge from and sends its transactions to.
  besu {
    url     = "http://127.0.0.1:8545"
    chainId = 33

    # Optional. Defaults are in SequencerDefaults.
    # gasLimit = 4000000
    # gasPrice = 1000
  }

  # The bitcoin network the bridge is pegged to: mainnet, testnet or regtest.
  network = "regtest"

  # The first block at which bridge transactions must pay a fee. The same number the chain's
  # genesis file carries as bridgeTxsPaidBlock.
  bridgeTxsPaidFromBlock = 100000

  # The bitcoin node this sequencer watches. Given rather than discovered: it is expected to be
  # one the operator runs.
  bitcoinPeerAddresses = [ "127.0.0.1:18444" ]

  # Where the bitcoin chain and the gathered peg-in proofs are kept.
  databaseDir = "/var/lib/bmb-sequencer"

  # All three keys are required. MST signs nothing on this chain, but a federation member is
  # registered with three and the bridge reports three. One file or one device each, never shared.
  #
  # A key file must be readable by its owner and nobody else, and contains the key as hex.
  signers {
    BTC { type = "keyFile", path = "/secure/btc.key" }
    RSK { type = "keyFile", path = "/secure/rsk.key" }
    MST { type = "keyFile", path = "/secure/mst.key" }
  }

  # Cadences. All optional.
  #
  # turnPeriodMs is one member's slot; a full round is this times the size of the federation, so
  # with nine members each acts every thirteen and a half minutes and somebody acts every ninety
  # seconds. Informing the bridge about bitcoin is work only one member needs to do.
  #
  # releasePeriodMs is not a turn. Every signature counts towards the threshold, so every member
  # signs every peg-out.
  #
  # turnPeriodMs      = 90000
  # releasePeriodMs   = 90000
  # watcherPeriodMs   = 120000

  # How long to put up with a node that will not answer before stopping. Stopping is deliberate:
  # a process that looks alive while informing the bridge of nothing hides the problem.
  # nodeUnreachableAttempts = 10
  # nodeRetryPeriodMs       = 30000
}
