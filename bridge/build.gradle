/*
 * PowPeg bridge module.
 *
 * Sources under src/main/java are derived from RSKj (co.rsk.peg and the utility classes it
 * depends on) and are licensed under the GNU Lesser General Public License v3.0, not the Apache
 * License that covers the rest of this repository. They keep their original package names so that
 * future RSK protocol changes can be ported by diff. This module is built as its own jar.
 */

apply plugin: 'java-library'

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash,
      'Automatic-Module-Name': 'bmb.bridge'
      )
  }
}

dependencies {
  api 'org.slf4j:slf4j-api'
  implementation project(':datatypes')
  implementation project(':evm')
  implementation project(':ethereum:rlp')
  implementation project(':crypto:algorithms')
  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'io.consensys.tuweni:tuweni-units'
  implementation('co.rsk.bitcoinj:bitcoinj-thin:0.14.4-bmb-new-rsk-18') {
    // Maven enforcer rule artifact declared as a compile dependency upstream; not needed at compile or runtime.
    exclude group: 'uk.co.froot.maven.enforcer'
  }
  implementation 'org.bouncycastle:bcprov-jdk18on'
  implementation 'org.web3j:abi'
  implementation 'com.google.guava:guava'
  implementation 'com.github.ben-manes.caffeine:caffeine'
  implementation 'org.apache.commons:commons-lang3'
  implementation 'com.fasterxml.jackson.core:jackson-databind'

  testImplementation project(':ethereum:core')
  testImplementation project(':ethereum:core:plugin-api-worldstate')
  testImplementation project(':ethereum:core:plugin-api-worldstate-backend')
  testImplementation project(path: ':ethereum:core', configuration: 'testSupportArtifacts')
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}

// The RSKj-derived sources are kept close to upstream for diffability: no reformatting, no
// header rewriting, and no lint or errorprone gating until the port settles (step 4 onwards).
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs.remove('-Werror')
  options.errorprone.enabled = false
}

spotless {
  java {
    targetExclude 'src/**/*.java'
  }
}

javadoc {
  enabled = false
}
